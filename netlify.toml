[build]
  command = "npm run build -w @kaizer/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
