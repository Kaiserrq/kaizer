appId: com.kaizer.assistant
productName: KAIZER
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: KAIZER
